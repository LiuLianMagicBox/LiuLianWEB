global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout tunnel 1h

frontend website
    bind 127.0.0.1:30011
    # Only the local Cloudflare Tunnel connector reaches this listener.
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-For %[req.hdr(CF-Connecting-IP)] if { req.hdr(CF-Connecting-IP) -m found }
    http-request set-header X-Forwarded-Proto https
    acl internal_api path_beg /api/ssh /api/rdp /api/chromium /api/files /api/guild-manager /api/admin /api/connections /api/mobile /api/vless-tunnel /connect /socket.io /clash-sub
    acl proxied_assets req.hdr(Referer) -m sub /connect/
    acl websocket req.hdr(Upgrade) -i websocket
    use_backend router_only if internal_api
    use_backend router_only if proxied_assets
    use_backend router_only if websocket
    default_backend regional_web

backend regional_web
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    http-response set-header X-LiuLian-Node %[srv_name]
    server router 127.0.0.1:30012 check inter 3s fall 2 rise 2
    server regional 127.0.0.1:30013 check inter 3s fall 2 rise 2

backend router_only
    option httpchk GET /healthz
    http-check expect status 200
    http-response set-header X-LiuLian-Node %[srv_name]
    server router 127.0.0.1:30012 check inter 3s fall 2 rise 2
