name: CI

on:
  push:
  pull_request:

jobs:
  website:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: website-part
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website-part/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Check committed frontend assets
        shell: bash
        run: |
          changes=$(git status --porcelain --untracked-files=all -- public)
          if [[ -n "$changes" ]]; then
            echo "$changes"
            exit 1
          fi
      - name: Test roller endpoints in the runtime image
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          docker build -f website-part/Dockerfile -t liulianweb-ci .
          docker run --rm --network none liulianweb-ci node --test test/roller_image.test.js
